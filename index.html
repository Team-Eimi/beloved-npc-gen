<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9efea">
  <meta name="description" content="Beloved NPC Gen: type-based NPC stat blocks.">
  <title>Beloved NPC Gen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script defer src="generator.js"></script>
  <script defer src="monster.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="workspace">
    <header class="page-header">
      <h1>Beloved NPC Gen</h1>
      <div class="page-controls">
        <div class="control-group" role="group" aria-label="Character generator">
          <label class="select-field">Type
            <select id="type-select" disabled></select>
          </label>
          <label class="select-field">Subtype
            <select id="subtype-select" disabled><option value="">—</option></select>
          </label>
          <label class="magic-toggle"><input id="include-magic" type="checkbox"> Magic</label>
          <button id="generate" class="button primary" disabled><i data-lucide="shuffle"></i> Character</button>
        </div>
        <div class="control-group" role="group" aria-label="Monster generator">
          <label class="select-field">Level
            <select id="level-select" disabled></select>
          </label>
          <button id="generate-monster" class="button secondary" disabled><i data-lucide="skull"></i> Monster</button>
        </div>
      </div>
    </header>
    <article class="stat-sheet" aria-labelledby="npc-type">
      <header class="sheet-header">
        <h2 id="npc-type">TYPE (Subtype)</h2>
        <button id="copy" class="icon-button" title="Copy stat block" aria-label="Copy stat block" disabled><i data-lucide="copy"></i></button>
      </header>
      <table class="stats" id="stats-table">
        <caption class="sr-only">Statistics</caption>
        <thead id="stat-headers"></thead>
        <tbody id="stat-values"></tbody>
      </table>
      <dl class="details" id="details"></dl>
    </article>
  </main>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">Enable JavaScript to generate a stat block.</p></noscript>
</body>
</html>
