<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9efea">
  <meta name="description" content="Beloved NPC Gen: type-based NPC stat blocks.">
  <title>Beloved NPC Gen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script defer src="generator.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="workspace">
    <header class="page-header">
      <h1>Beloved NPC Gen</h1>
      <div class="page-controls">
        <label class="magic-toggle"><input id="include-magic" type="checkbox"> Magic</label>
        <button id="generate" class="button primary" disabled><i data-lucide="shuffle"></i> Generate</button>
      </div>
    </header>
    <article class="stat-sheet" aria-labelledby="npc-type">
      <header class="sheet-header">
        <h2 id="npc-type">TYPE (Subtype)</h2>
        <button id="copy" class="icon-button" title="Copy stat block" aria-label="Copy stat block" disabled><i data-lucide="copy"></i></button>
      </header>
      <table class="stats">
        <caption class="sr-only">NPC statistics</caption>
        <thead><tr><th id="label-STR" scope="col">Strength</th><th id="label-CON" scope="col">Constitution</th><th id="label-CHA" scope="col">Charm</th><th id="label-INT" scope="col">Intelligence</th><th id="label-AGI" scope="col">Agility</th><th id="label-MAG" scope="col" hidden>Magic</th></tr></thead>
        <tbody><tr><td id="stat-STR"></td><td id="stat-CON"></td><td id="stat-CHA"></td><td id="stat-INT"></td><td id="stat-AGI"></td><td id="stat-MAG" hidden></td></tr></tbody>
      </table>
      <dl class="details">
        <div hidden><dt>Traits:</dt><dd id="traits"></dd></div>
        <div><dt>Resistances &amp; Vulnerabilities:</dt><dd id="resistancesAndVulnerabilities"></dd></div>
        <div><dt>Titles:</dt><dd id="titles"></dd></div>
        <div><dt>Skills:</dt><dd id="skills"></dd></div>
        <div><dt>Speciality Skills:</dt><dd id="specialitySkills"></dd></div>
      </dl>
    </article>
  </main>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">Enable JavaScript to generate a stat block.</p></noscript>
</body>
</html>
